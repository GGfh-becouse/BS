  /* ---------- Notifications & UI ---------- */
  function toastHigh(text){ Notify.push(text, {id:'sys:'+text, priority:'high', cooldown:3, duration:3.4}); }
  function toastNormal(text,id='n'){ Notify.push(text, {id, priority:'normal', cooldown:2, duration:2.6}); }
  function toastLow(text,id='l'){ Notify.push(text, {id, priority:'low', cooldown:1, duration:1.8}); }

  /* ---------- Sound (procedural, layered) ---------- */
  const Audio = (()=>{
    let ctx=null, master=null, engine=null, engGain=null, musicTimer=0, musicStep=0, sn={m:1,s:1,v:.5}, warnEngine=0, active=[];
    function init(){
      if(ctx) return;
      try{
        ctx = new (window.AudioContext||window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value=.85; master.connect(ctx.destination);
        // engine
        engine = ctx.createOscillator(); engine.type='sawtooth'; engine.frequency.value=45;
        engGain = ctx.createGain(); engGain.gain.value=0;
        engine.connect(engGain); engGain.connect(master); engine.start();
        // ambient
        const amb = ctx.createBufferSource(); const b = ctx.createBuffer(1, ctx.sampleRate*4, ctx.sampleRate);
        const d = b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*.06*Math.sin(i/9000);
        amb.buffer=b; amb.loop=true; const g=ctx.createGain(); g.gain.value=.15; amb.connect(g); g.connect(master); amb.start();
      }catch(e){}
    }
    function tone(freq,dur,type,vol,when=0,music=false){
      if(!ctx) return;
      const o=ctx.createOscillator(), n=ctx.createGain(), t=ctx.currentTime+when;
      o.type=type; o.frequency.value=freq;
      n.gain.setValueAtTime(vol*sn.v,t);
      n.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(n); n.connect(master); o.start(t); o.stop(t+dur);
    }
    function noise(dur,vol){
      if(!ctx) return;
      const b=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      const src=ctx.createBufferSource(), n=ctx.createGain();
      n.gain.value=vol*sn.v; src.buffer=b; src.connect(n); n.connect(master); src.start();
    }
    function sfx(n){
      if(!ctx) return;
      if(n==='shot'){ noise(.14,.5); tone(130,.1,'square',.2); }
      else if(n==='crash') noise(.3,.6);
      else if(n==='cash'){ tone(880,.1,'square',.1); tone(1320,.15,'square',.1,.08); }
      else if(n==='punch') noise(.07,.4);
      else if(n==='horn') tone(330,.3,'sawtooth',.15);
      else if(n==='step') noise(.03,.08);
      else if(n==='reload') tone(220,.06,'square',.08);
    }
    function music(dt){
      if(!ctx) return;
      musicTimer -= dt;
      if(musicTimer > 0) return;
      const chasing = state.wanted>0;
      musicTimer = chasing ? .18 : .36;
      const scale=[0,3,5,7,10,12,7,3], base=55;
      const f = base * Math.pow(2, scale[musicStep++%8]/12);
      tone(f,.32,'triangle',.2);
      if(chasing && musicStep%2) tone(f*4,.1,'square',.05);
      else if(musicStep%4===0) tone(f*2,.5,'sine',.08);
    }
    function engineUpdate(speed, active_){
      if(!ctx) return;
      if(active_){ engGain.gain.value = .035*sn.s; engine.frequency.value = 40 + speed*.35; }
      else engGain.gain.value = 0;
    }
    function toggle(kind){
      sn[kind] = 1-sn[kind];
    }
    return {init,sfx,music,engineUpdate,toggle,sn};
  })();

  /* ---------- Player & Camera ---------- */
  const camera = Render.camera;
  const K = {};
  function updatePlayer(dt){
    if(P.hidden || state.cutscene || state.intro>0) return;
    if(player) player.mesh.visible = !P.car && !P.hidden;
    const ax = (K.KeyD||K.ArrowRight?1:0) - (K.KeyA||K.ArrowLeft?1:0) + (Joystick.x||0);
    const ay = (K.KeyS||K.ArrowDown?1:0) - (K.KeyW||K.ArrowUp?1:0) + (Joystick.y||0);
    P.aiming = (K.aim||TouchAimActive)?1:0;
    P.sprinting = !!(K.ShiftLeft||K.ShiftRight);

    if(P.car){
      const c = P.car;
      const th = (K.KeyW||K.ArrowUp)?1:(K.KeyS||K.ArrowDown)?-1:0;
      const st = clamp(ax,-1,1);
      drive(c, dt, th, st, K.Space);
      if(c.hp<=0 && Math.random()<.3) fx.push({x:c.x,y:c.y,t:'💨',l:.8});
    } else {
      const l = hyp(ax,ay);
      if(l>.1){
        const run = P.sprinting;
        const sp = (run?155:95)*(P.aiming?.5:1)*Math.min(1,l)/l*dt;
        const nx = P.x + ax*sp, ny = P.y + ay*sp;
        if(!World.solidR(nx, P.y, 6)) P.x = nx;
        if(!World.solidR(P.x, ny, 6)) P.y = ny;
        if(Math.random()<.08) Audio.sfx('step');
        if(!TouchAimActive) P.a = Math.atan2(ay,ax);
      }
      if(!TouchAimActive) P.a = aimAngle();
      if(K.fire && P.attackCD<=0){
        if(state.hasGun && state.equipped) shoot();
        else punch();
      }
    }
    // reloading
    if(P.reloading>0){ P.reloading -= dt; if(P.reloading<=0){ const n=Math.min(12-state.clip, state.ammo); state.clip+=n; state.ammo-=n; } }
    P.attackCD -= dt; P.fireCd -= dt;

    // stamina
    if(P.sprinting && !P.car) state.stamina = Math.max(0, state.stamina - dt*18);
    else state.stamina = Math.min(100, state.stamina + dt*22);

    if(state.hp<=0 && !P.dead) wasted();
    state.hp = P.hp;
  }

  function aimAngle(){
    const mx = Mouse.x, my = Mouse.y;
    const ndcX = (mx/innerWidth)*2-1, ndcY = -(my/innerHeight)*2+1;
    const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(ndcX,ndcY), camera);
    const plane = new THREE.Plane(new THREE.Vector3(0,1,0), -6);
    const hit = new THREE.Vector3();
    if(rc.ray.intersectPlane(plane, hit)) return Math.atan2(hit.z - P.y, hit.x - P.x);
    return P.a;
  }

  function punch(){
    P.attackCD = .42; P.punchT = .22;
    Audio.sfx('punch');
    for(const p of peds){
      if(p.ko) continue;
      const d = hyp(p.x-P.x, p.y-P.y);
      if(d<32 && Math.cos(wrap(Math.atan2(p.y-P.y,p.x-P.x)-P.a))>.3) damagePed(p, 15, P.a);
    }
  }

  function shoot(){
    if(P.fireCd>0) return;
    if(state.clip<=0){ startReload(); return; }
    state.clip--; P.attackCD=.26; P.fireCd=.14;
    let a = P.a;
    if(TouchAimActive && TouchAimTarget){
      a = Math.atan2(TouchAimTarget.y-P.y, TouchAimTarget.x-P.x);
    }
    a += rnd(-1,1)*(P.aiming?.02:.07);
    Audio.sfx('shot');
    // Segment vs world (march)
    const maxDist = 320;
    const step = 4;
    let hitX = P.x, hitY = P.y, blocked = false;
    for(let d=14; d<maxDist; d+=step){
      const x = P.x + Math.cos(a)*d;
      const y = P.y + Math.sin(a)*d;
      if(World.solid(x,y)){ blocked=true; hitX=x; hitY=y; break; }
      let found = null;
      for(const p of peds){ if(p.ko) continue; if(dist2(p.x,p.y,x,y) < 100){ found=p; break; } }
      if(found){ damagePed(found, 22, a); hitX=found.x; hitY=found.y; blocked=true; break; }
    }
    if(!blocked){ hitX = P.x+Math.cos(a)*maxDist; hitY = P.y+Math.sin(a)*maxDist; }
    bullets.push({x1:P.x,y1:P.y,x2:hitX,y2:hitY,life:.08});
  }

  function startReload(){
    if(P.reloading>0 || state.clip>=12 || state.ammo<=0) return;
    P.reloading = 1.1; Audio.sfx('reload');
  }

  function damagePed(p, amount, dir){
    p.hp -= amount; p.fl = 5; p.panic = Math.max(p.panic, 4);
    p.x += Math.cos(dir)*6; p.y += Math.sin(dir)*6;
    if(!p.h) addWanted(1);
    if(p.hp<=0) ko(p);
  }

  function ko(p){
    if(p.ko) return;
    p.ko = 3; p.state='ko';
    pickups.push({x:p.x,y:p.y,v:Math.random()<.7?ri(5,40):ri(10,100),l:30,type:'cash'});
    state.kills++;
  }

  function addWanted(n){
    if(state.suspicion <= 0 && n>=1){ // require witness
      state.suspicion = 0.7; // will raise
    }
    state.wanted = Math.min(5, Math.max(state.wanted, n));
    state.wantedT = 0;
  }

  function drive(c, dt, th, st, hb){
    const spec = CP(c.t);
    const mx = spec[2], accel = spec[3];
    const f = [Math.cos(c.a), Math.sin(c.a)], r = [-f[1], f[0]];
    let vf = c.vx*f[0] + c.vy*f[1];
    let vl = c.vx*r[0] + c.vy*r[1];
    const ok = c.hp>0;
    const maxV = mx*(ok?1:.15);
    if(th>0) vf += accel*dt*th*(ok?1:.1);
    else if(th<0) vf += (vf>10?-spec[7]:-accel*.7)*dt;
    if(hb) vf *= Math.exp(-2.4*dt);
    vf *= Math.exp((th?-.32:-1)*dt);
    vf = clamp(vf, -maxV*.35, maxV);
    c.sa = (c.sa||0) + (st - (c.sa||0))*Math.min(1,7*dt);
    const turn = c.sa * spec[4] * dt * clamp(vf/90,-1,1) / (1+Math.abs(vf)/170);
    c.a += turn;
    const slipping = (Math.abs(c.sa)>.8 && vf>maxV*.9) || (hb && Math.abs(vf)>80);
    vl *= Math.exp(-(c.t>10?2.2:slipping?3.5:16)*dt);
    c.vx = f[0]*vf + r[0]*vl;
    c.vy = f[1]*vf + r[1]*vl;
    moveCar(c, dt);
  }

  function CP(t){ return [
    [48,22,5.5,24,5.5,-2,4.2,300],[50,22,6.5,25,6,-2,4.8,330],[50,22,7,28,7.5,-1,5,280],
    [48,23,4.2,15,3.8,-3,4,370],[47,22,4.2,15,3.8,-3,4,380],[50,21,5.5,24,5.5,-2,4.2,300],
    [46,20,5.2,22,5.5,-1,4,260],[41,20,5.5,22,6,-3,3.9,260],[50,22,11,38,4,3,4.2,240],
    [50,21,5.5,24,5.5,-2,4.2,320],[70,24,15,58,6,0,5,160]
  ][t] || [48,22,5.5,24,5.5,-2,4.2,260];
  }

  function moveCar(c, dt){
    const water = c.t>10;
    const r = water?16:15;
    let nx = c.x + c.vx*dt, ny = c.y + c.vy*dt, impact = 0;
    if(water){
      // water-bound: stay on water tile
      if(!World.isWater(nx,ny) && !World.isWater(c.x,ny)) { c.vx*=-.3; impact=Math.abs(c.vx); nx=c.x; }
      if(!World.isWater(nx,ny) && !World.isWater(nx,c.y)) { c.vy*=-.3; impact=Math.max(impact,Math.abs(c.vy)); ny=c.y; }
    } else {
      if(World.solidR(nx, c.y, r)){ impact=Math.abs(c.vx); c.vx*=-.35; nx=c.x; }
      if(World.solidR(nx, ny, r)){ impact=Math.max(impact,Math.abs(c.vy)); c.vy*=-.35; ny=c.y; }
    }
    c.x = nx; c.y = ny;
    if(impact > 70) damageCar(c, impact);
  }

  function damageCar(c, impact){
    if(c.cd>0) return;
    c.cd = .3;
    c.hp = Math.max(0, c.hp - impact*.07 / 5);
    if(c === P.car){
      state.crashes++;
      shakeCamera(impact/10);
      Audio.sfx('crash');
    }
  }

  /* ---------- Traffic & Police ---------- */
  function aiCar(c, dt){
    if(c.ai===3){ shipAi(c, dt); return; }
    if(c.stun>0){ c.stun-=dt; c.sp*=Math.exp(-3*dt); return; }
    const tx = c.x/T|0, ty = c.y/T|0;
    const cellKey = ty*N+tx;
    if(tx%10<2 && ty%10<2){
      if(c.cell !== cellKey){
        c.cell = cellKey;
        const forward = (c.dir%4);
        const opts = [(forward+1)%4, (forward+3)%4].filter(d=>roadDir(tx,ty,d));
        const full  = [0,1,2,3].filter(d=>d!==(forward+2)%4 && roadDir(tx,ty,d));
        if(opts.length && Math.random()<.5) c.dir = opts[ri(0,opts.length-1)];
        else if(!roadDir(tx,ty,c.dir)) c.dir = full.length? full[ri(0,full.length-1)] : (c.dir+2)%4;
      }
    }
    const dx=[1,0,-1,0][c.dir], dy=[0,1,0,-1][c.dir];
    const bx=(tx/10|0)*10, by=(ty/10|0)*10;
    // lane follow
    const targetX = (c.dir%2===1) ? bx*T + (c.dir===1? .5:.5+16) : c.x;
    const targetY = (c.dir%2===0) ? by*T + (c.dir===0? 16 : 16) : c.y;
    if(c.dir%2===0) c.y += ((by*T + (c.dir===0?16:16)) - c.y)*Math.min(1,6*dt);
    else c.x += ((bx*T + (c.dir===1?16:16)) - c.x)*Math.min(1,6*dt);
    c.a += wrap(c.dir*Math.PI/2 - c.a) * Math.min(1,8*dt);
    let targetSpeed = (CP(c.t)[2])*.42;
    // stop for red light
    const ix = (c.x+dx*38)/T|0, iy = (c.y+dy*38)/T|0;
    if(World.tileAt(c.x+dx*34, c.y+dy*34)===2) targetSpeed=0;
    // check obstacles
    const fr = o => {
      const ox=o.x-c.x, oy=o.y-c.y;
      const f=ox*dx+oy*dy, lat=Math.abs(-ox*dy+oy*dx);
      return f>0 && f<78 && lat<(c.off?10:24);
    };
    let obstacle = false;
    for(const o of cars) if(o!==c && fr(o)){ obstacle=true; break; }
    if(!obstacle) for(const p of peds) if(!p.ko && fr(p)){ obstacle=true; break; }
    if(!obstacle && P.car && fr(P.car)) obstacle = true;
    if(!obstacle && !P.car && fr(P)) obstacle = true;
    if(obstacle){
      targetSpeed=0;
      c.bt = (c.bt||0) + dt;
      if(c.bt > 1.6 && !c.off && c.sp<8) c.off = Math.random()<.5?18:-18;
    } else {
      c.bt=0;
      if(c.off && (c.ot=(c.ot||0)+dt)>2.5){ c.off=0; c.ot=0; }
    }
    c.sp += (targetSpeed - c.sp)*Math.min(1,(targetSpeed?1.5:5)*dt);
    c.x += dx*c.sp*dt; c.y += dy*c.sp*dt;
    c.vx = dx*c.sp; c.vy = dy*c.sp;
    c.stuck = (c.sp<3)? (c.stuck||0)+dt : 0;
    if(c.stuck>2.5){ // recover
      c.dir=(c.dir+1)%4; c.stuck=0; c.off=0;
    }
  }

  function roadDir(tx,ty,d){
    const x=tx+[1,0,-1,0][d]*3, y=ty+[0,1,0,-1][d]*3;
    return x>=0&&y>=0&&x<N&&y<N&&World.M[y*N+x]===0;
  }

  function shipAi(c, dt){
    const speed = c.t===13?22:45;
    const cx=Math.cos(c.a), cy=Math.sin(c.a);
    if(World.solidR(c.x+cx*70, c.y+cy*70, 14)) c.a += dt*.7;
    else { c.x += cx*speed*dt; c.y += cy*speed*dt; }
    c.vx = cx*speed; c.vy = cy*speed; c.sp = speed;
  }

  function cop(c, dt){
    const target = P.car||P;
    const a = Math.atan2(target.y-c.y, target.x-c.x);
    const df = wrap(a - c.a);
    c.st2 = (c.st2||0) - dt;
    let th = 1, st = clamp(df*2, -1, 1);
    if(hyp(c.vx,c.vy)<18) c.stk = (c.stk||0) + dt; else c.stk = 0;
    if(c.stk>1.2){ c.st2=.8; c.stk=0; }
    if(c.st2>0){ th=-1; st=-st; }
    if(hyp(target.x-c.x,target.y-c.y)<26 && !P.car && P.hp>0 && c.cd<=0){
      P.hp -= 12; c.cd = .7; shakeCamera(4);
    }
    if(c.hp<=0) th = 0;
    drive(c, dt, th*(.55+state.wanted*.1), st, 0);
  }

  /* ---------- Update world entities ---------- */
  function updateEntities(dt){
    // cars
    for(const c of cars){
      c.cd -= dt;
      if(c === P.car) continue;
      if(c.police) cop(c, dt);
      else if(c.ai) aiCar(c, dt);
      else drive(c, dt, 0, 0, 0);
    }
    // car-car collisions
    for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){
      const a=cars[i], b=cars[j];
      const d = hyp(a.x-b.x, a.y-b.y);
      if(d<34 && d>0){
        const nx=(a.x-b.x)/d, ny=(a.y-b.y)/d;
        const rv = hyp(a.vx-b.vx, a.vy-b.vy);
        if(a.ai&&a.sp>1 && b.ai&&b.sp>1){
          // both ai: stun and avoid
          a.stun = Math.max(a.stun, .4); b.stun = Math.max(b.stun, .4);
          a.off = (Math.random()<.5?18:-18); b.off = -a.off;
        }
        if(!a.ai || a.sp<1){ a.x += nx*(34-d)*.5; a.y += ny*(34-d)*.5; }
        if(!b.ai || b.sp<1){ b.x -= nx*(34-d)*.5; b.y -= ny*(34-d)*.5; }
        const t1=a.vx,t2=a.vy; a.vx=b.vx*.8; a.vy=b.vy*.8; b.vx=t1*.8; b.vy=t2*.8;
        if(rv>60){ damageCar(a, rv*.8); damageCar(b, rv*.8); if((a===P.car||b===P.car) && (a.police||b.police)) addWanted(2); }
      }
    }
    // despawn far
    for(let i=cars.length-1;i>=0;i--){
      const c=cars[i];
      const pp = P.car||P;
      if(c!==P.car && !c.mission && hyp(c.x-pp.x,c.y-pp.y)>1100) cars.splice(i,1);
    }
    // peds
    for(let i=peds.length-1;i>=0;i--){
      const p = peds[i];
      if(p.ko){ p.ko -= dt; if(p.ko<=0) peds.splice(i,1); continue; }
      p.cd -= dt; p.fl -= dt; p.panic = Math.max(0, p.panic-dt);
      const pa = P.car||P;
      const d = hyp(p.x-P.x, p.y-P.y);
      if(!p.h && d>1000){ peds.splice(i,1); continue; }
      // traffic hits ped
      if(P.car && hyp(P.car.vx,P.car.vy)>100 && hyp(p.x-P.car.x,p.y-P.car.y)<24){
        p.hp = 0; ko(p); addWanted(1); Audio.sfx('punch'); continue;
      }
      // FSM
      if(p.h){
        // hostile: chase player
        if(!P.car || d<400){
          const a = Math.atan2(pa.y-p.y, pa.x-p.x);
          if(hyp(p.x-pa.x, p.y-pa.y)>18){
            const nx = p.x + Math.cos(a)*68*dt, ny = p.y + Math.sin(a)*68*dt;
            if(!World.solidR(nx, p.y, 5)) p.x = nx;
            if(!World.solidR(p.x, ny, 5)) p.y = ny;
          } else if(p.cd<=0 && !P.car){
            P.hp -= 7; p.cd = .9; shakeCamera(3); Audio.sfx('punch');
          }
          p.state = 'attack';
        }
      } else if(p.panic>0 || (P.car && hyp(P.car.vx,P.car.vy)>90 && d<110) || bullets.some(b => dist2(b.x2,b.y2,p.x,p.y)<26000)){
        // panic: run away
        const a = Math.atan2(p.y-pa.y, p.x-pa.x);
        const nx = p.x + Math.cos(a)*88*dt, ny = p.y + Math.sin(a)*88*dt;
        if(!World.solidR(nx, p.y, 5)) p.x = nx;
        if(!World.solidR(p.x, ny, 5)) p.y = ny;
        p.a = a; p.state = 'panic';
      } else {
        // walk/patrol
        p.tm -= dt;
        if(p.tm<=0){
          p.a = ri(0,3)*1.57;
          p.sp = Math.random()<.3?0:1;
          p.tm = rnd(1,4);
          p.state = p.sp? 'walk' : 'idle';
        }
        if(p.sp){
          const nx = p.x + Math.cos(p.a)*26*dt, ny = p.y + Math.sin(p.a)*26*dt;
          if(!World.walkable(nx,ny) || peds.some(o=>o!==p && !o.ko && hyp(o.x-nx,o.y-ny)<9)) p.tm = 0;
          else if(World.tileAt(nx,ny)===0 && cars.some(c=>hyp(c.x-nx,c.y-ny)<130 && hyp(c.vx,c.vy)>25)){ p.tm=.4; p.sp=0; }
          else { p.x = nx; p.y = ny; }
        }
      }
    }
    // pickups
    for(let i=pickups.length-1;i>=0;i--){
      const k = pickups[i]; k.l -= dt;
      const pa = P.car||P;
      if(hyp(k.x-pa.x,k.y-pa.y)<18){
        addCash(k.v, k.x, k.y);
        pickups.splice(i,1);
      } else if(k.l<=0) pickups.splice(i,1);
    }
    // bullets/fx
    for(let i=fx.length-1;i>=0;i--){ fx[i].l -= dt; fx[i].y -= 20*dt; if(fx[i].l<=0) fx.splice(i,1); }
    for(let i=bullets.length-1;i>=0;i--){ bullets[i].life -= dt; if(bullets[i].life<=0) bullets.splice(i,1); }

    // events
    evT -= dt;
    if(evT<=0){ evT = rnd(35,60); spawnCashPickup(); }
  }

  function addCash(amount, x, y){
    state.cash += amount;
    fx.push({x, y, t:'+$'+amount, l:1.5, cash:true});
    Audio.sfx('cash');
    toastLow('', 'cash:'+Date.now());
  }

  function spawnCashPickup(){
    const pa = P.car||P;
    const q = safeSpot(pa.x + rnd(-150,150), pa.y + rnd(-150,150));
    pickups.push({x:q[0], y:q[1], v:ri(5,100), l:40, type:'cash'});
    toastLow('💰 Рядом деньги', 'cashpickup');
  }

  function safeSpot(x,y){
    for(let i=0;i<30;i++){
      const a = x + rnd(-60,60), b = y + rnd(-60,60);
      if(!World.solidR(a,b,8)) return [a,b];
    }
    return [x,y];
  }

  let evT = 30;

  /* ---------- Spawning ---------- */
  function spawnTraffic(){
    const q = randomRoadSpot();
    if(!q) return;
    const tx = q[0]/T|0, ty = q[1]/T|0;
    let dir, x, y;
    if(ty%10<2 && tx%10>1){ dir = ty%10===0?2:0; x=q[0]; y=(ty+.5)*T; }
    else if(tx%10<2 && ty%10>1){ dir = tx%10===0?1:3; x=(tx+.5)*T; y=q[1]; }
    else return;
    const type = rndCarType();
    spawnCar(type, x, y, dir*1.57, {ai:1, dir, sp:60});
  }

  function randomRoadSpot(){
    const pp = P.car||P;
    for(let i=0;i<25;i++){
      const a = rnd(0,TAU), r = rnd(450,800);
      const x = pp.x + Math.cos(a)*r, y = pp.y + Math.sin(a)*r;
      if(x<0||y<0||x>=N*T||y>=N*T) continue;
      if(World.tileAt(x,y)===0) return [x,y];
    }
  }

  function rndCarType(){
    const r = Math.random();
    return r<.012?4 : r<.03?3 : r<.07?10 : [6,6,7,7,8,6,7,5,0,2,6,7][ri(0,11)];
  }

  function spawnCop(){
    const q = randomRoadSpot();
    if(q) spawnCar(9, q[0], q[1], 0, {police:true, hp:90, ai:0});
  }

  function spawnMgr(dt){
    const pa = P.car||P;
    const tx = pa.x/T/10|0, ty = pa.y/T/10|0;
    const d = World.zoneName(pa.x,pa.y);
    const want = d==='DOWNTOWN'?16 : d==='SUBURBS'?6 : 11;
    const nPed = peds.filter(p=>!p.h).length;
    const nTraffic = cars.filter(c=>c.ai && !c.mission).length;
    const nParked = cars.filter(c=>!c.ai && !c.police && !c.mission).length;
    if(nPed<16 && Math.random()<.1){
      const a = rnd(0,TAU), r = rnd(300,650);
      const x = pa.x + Math.cos(a)*r, y = pa.y + Math.sin(a)*r;
      if(World.walkable(x,y)) spawnPed(x,y);
    }
    if(nTraffic<8 && Math.random()<.1) spawnTraffic();
    if(nParked<8 && Math.random()<.05) spawnParked();
    const nCops = cars.filter(c=>c.police).length;
    const wantCops = state.wanted? Math.ceil(state.wanted*1.5) : 0;
    if(nCops<wantCops && Math.random()<.03) spawnCop();
    if(state.wanted>0){
      const near = cars.some(c=>c.police && hyp(c.x-pa.x,c.y-pa.y)<380);
      if(near) state.wantedT = 0;
      else { state.wantedT += dt; if(state.wantedT>10){ state.wanted--; state.wantedT=0; } }
    }
  }

  function spawnParked(){
    const pp = P.car||P;
    for(let i=0;i<20;i++){
      const x = pp.x + rnd(-700,700);
      const y = pp.y + rnd(-700,700);
      if(World.tileAt(x,y)!==1 || World.solidR(x,y,14)) continue;
      if(hyp(x-pp.x, y-pp.y)<200) continue;
      spawnCar(rndCarType(), x, y, ri(0,3)*1.57);
      return;
    }
  }

  /* ---------- Camera ---------- */
  let shake = 0;
  function shakeCamera(v){ shake = Math.max(shake, Math.min(20, v)); }

  function updateCamera(dt){
    const pp = P.car||P;
    const car = P.car;
    const targetYaw = car ? car.a : (state.cameraYaw||-Math.PI/2);
    // free orbit if not in car
    if(!car && (K.ArrowLeft||K.ArrowRight) && !K.ArrowUp && !K.ArrowDown){ /* handled by aiming */ }
    const yaw = car ? lerp(state.cameraYaw, targetYaw, 1-Math.exp(-2.6*dt)) : state.cameraYaw;
    state.cameraYaw = car ? yaw : state.cameraYaw;

    const dist = car ? (120 + hyp(car.vx,car.vy)*.14) : 150;
    const height = car ? (58 + hyp(car.vx,car.vy)*.05) : 140;
    const pitch = state.cameraPitch;

    const ca = Math.cos(yaw), sa = Math.sin(yaw);
    const gyp = car? -6 : World.heightAt(pp.x,pp.y);
    const fx = pp.x, fz = pp.y;
    let px = fx - ca*dist*Math.cos(pitch);
    let py = height + gyp;
    let pz = fz - sa*dist*Math.cos(pitch);

    // collision check via raycast
    const rc = new THREE.Raycaster(new THREE.Vector3(fx, py, fz), new THREE.Vector3(px-fx, 0, pz-fz).normalize());
    // Simple tile-based anti-clip
    let k = 1;
    for(let i=1;i<=14;i++){
      const f = i/14;
      const x = fx + (px-fx)*f;
      const z = fz + (pz-fz)*f;
      const tx = (z/T|0)*N + (x/T|0);
      const y = gyp+8 + (py-gyp-8)*f;
      if(x>=0 && z>=0 && x<N*T && z<N*T && World.M[tx]===2 && y<Render.HB[tx]+3){
        k = Math.max(.18, (i-1.4)/14); break;
      }
    }
    const finalPx = fx + (px-fx)*k + (Math.random()-.5)*shake;
    const finalPy = gyp+8 + (py-gyp-8)*k + (1-k)*30 + (Math.random()-.5)*shake;
    const finalPz = fz + (pz-fz)*k + (Math.random()-.5)*shake;
    camera.position.set(finalPx, finalPy, finalPz);
    const lx = fx + ca*15;
    const ly = 4 + gyp;
    const lz = fz + sa*15;
    camera.lookAt(lx, ly, lz);
    shake *= Math.exp(-7*dt);
  }

  /* ---------- Rendering scene ---------- */
  function render(dt, now){
    const pp = P.car||P;
    // day/night
    const dk = clamp(-Math.cos((state.minutes-13)/24*TAU)-.2, 0, .65), n = dk/.65;
    const cD = new THREE.Color(0x7ec8ff), cN = new THREE.Color(0x0a0d2a), cW = new THREE.Color(0xff9a5a);
    const bg = new THREE.Color().copy(cD).lerp(cN, n);
    if(n>.05 && n<.9) bg.lerp(cW, Math.sin(n*Math.PI)*.35);
    Render.scene.background.copy(bg); Render.scene.fog.color.copy(bg);
    Render.scene.userData.sky.material.color.copy(bg);
    Render.ambient.intensity = .62 - .4*n;
    Render.sun.intensity = .95 - .78*n;
    Render.moonLight.intensity = n*.5;
    Render.sun.position.set(pp.x - 300, 500 - n*200, pp.y + 200);
    Render.moonLight.position.set(pp.x + 200, 300, pp.y - 150);
    Render.FMat.forEach(f=> f.m.emissiveIntensity = n*1.1);
    Render.neonMats.forEach(m=> m.opacity = .3 + .7*n);
    // traffic lights
    const ph = Math.floor(state.time);
    if(ph !== Render.scene.userData.ph){
      Render.scene.userData.ph = ph;
      const time = state.time%12;
      const LC = Render.scene.userData.LC;
      const lm = Render.scene.userData.trafficLight;
      Render.scene.userData.tlPos.forEach((q,i)=>{
        const state_ = q[2]===1 ? (time<5?'g':time<6?'y':'r') : (time<6?'r':time<11?'g':'y');
        lm.setColorAt(i, LC[state_]);
      });
      lm.instanceColor.needsUpdate = true;
    }
    // bridge
    const bw = (state.time+20)%60;
    const spans = []; // already built fixed in world
    // lamps follow player (only 4 closest)
    // handled at construction — we'll just leave static
    // update cars
    for(const c of cars){
      const m = ent(c, ()=>Render.carModel(c), c.x, c.t>10? -7 + Math.sin(now/500+c.x)*.6 : World.heightAt(c.x,c.y), c.y, -c.a);
      if(m.userData.pol){
        const f = Math.floor(now/150)%2;
        m.userData.pol[0].visible = !!f;
        m.userData.pol[1].visible = !f;
      }
    }
    // update peds
    for(const p of peds){
      const m = ent(p, ()=>Render.pedModel(p), p.x, World.heightAt(p.x,p.y), p.y, -p.a);
      if(p.ko){ m.userData.in.rotation.z = -1.5; m.userData.in.position.y = 3; }
      else { walkAnim(m, p, dt); m.userData.in.rotation.y = 0; }
    }
    // pickups
    for(const k of pickups){
      const m = ent(k, coinModel, k.x, World.heightAt(k.x,k.y)+8+Math.sin(now/200)*2, k.y, now/400);
    }
    // player
    if(player){
      player.mesh.visible = !P.car && !P.hidden;
      if(!P.car){
        player.mesh.position.set(P.x, World.heightAt(P.x,P.y), P.y);
        player.mesh.rotation.y = -P.a;
        walkAnim(player.mesh, player, dt);
        if(P.punchT>0){
          const k = Math.sin((1-P.punchT/.22)*Math.PI);
          player.mesh.userData.ra.rotation.z = 1.7*k;
          player.mesh.userData.la.rotation.z = -.4*k;
          player.mesh.userData.in.rotation.y = -.35*k;
        } else player.mesh.userData.in.rotation.y = 0;
        player.mesh.userData.g.visible = !!(state.hasGun && state.equipped);
      }
    }
    // NPC Daniel
    if(DN.mesh){
      const meet = !state.cutscene && state.dialogActive && !P.car && hyp(P.x-DAN[0],P.y-DAN[1])<90;
      const u = DN.mesh.position;
      let tx = DAN[0]+10, tz = DAN[1];
      if(meet){
        const d = hyp(tx-P.x, tz-P.y)||1;
        tx = P.x + (tx-P.x)/d*26; tz = P.y + (tz-P.y)/d*26;
      }
      u.x += (tx-u.x)*Math.min(1,2.5*dt);
      u.z += (tz-u.z)*Math.min(1,2.5*dt);
      if(meet){
        DN.mesh.rotation.y = -Math.atan2(P.y-u.z, P.x-u.x);
        P.a = Math.atan2(u.z-P.y, u.x-P.x);
        DN.mesh.userData.ra.rotation.z = 3;
      } else DN.mesh.userData.ra.rotation.z = 0;
      walkAnim(DN.mesh, DN, dt);
    }
    // remove unused entities from scene
    for(let i=activeEnts.length-1;i>=0;i--){
      const o = activeEnts[i];
      if(o._frame !== frame){ Render.scene.remove(o._mesh); o._mesh = null; activeEnts.splice(i,1); }
    }
    // bullets
    Render.scene.userData.bullets = bullets;
    // target marker
    const tg = getTarget();
    if(tg){
      if(!targetMarker) targetMarker = mkMarker();
      targetMarker.visible = true;
      targetMarker.position.set(tg[0], 85, tg[1]);
      targetMarker.scale.set((tg[2]/24)*(1+Math.sin(now/200)*.1),1,(tg[2]/24)*(1+Math.sin(now/200)*.1));
      targetMarker.material.color.set(tg[3]?0x38a0ff:0xffd60a);
    } else if(targetMarker) targetMarker.visible = false;
    // camera
    updateCamera(dt);
    // render main
    Render.renderer.render(Render.scene, camera);
    // 2D overlay bullets
    drawBullets2D();
  }

  let frame = 0;
  const activeEnts = [];
  function ent(o, factory, x,y,z, ry){
    if(!o._mesh){ o._mesh = factory(o); Render.scene.add(o._mesh); activeEnts.push(o); }
    o._frame = frame;
    o._mesh.position.set(x,y,z); o._mesh.rotation.y = ry;
    return o._mesh;
  }

  const coinModel = ()=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(5,5,1.5,12), new THREE.MeshBasicMaterial({color:0x3ddc84})); m.rotation.z=1.5708; const G=new THREE.Group(); G.add(m); return G; };
  let targetMarker = null;
  function mkMarker(){
    const m = new THREE.Mesh(new THREE.CylinderGeometry(24,24,170,20,1,true), new THREE.MeshBasicMaterial({color:0xffd60a, transparent:true, opacity:.35, side:THREE.DoubleSide, depthWrite:false}));
    Render.scene.add(m); return m;
  }

  /* ---------- Animation ---------- */
  function walkAnim(mesh, o, dt){
    const u = mesh.userData;
    const dx = o.x - (o._px ?? o.x), dz = o.y - (o._pz ?? o.y);
    const v = hyp(dx,dz)/Math.max(dt, .001);
    o._px = o.x; o._pz = o.y;
    o._ph = (o._ph||0) + Math.min(v,160)*dt*.24;
    const k = Math.min(1, v/40);
    const a = Math.sin(o._ph)*k*.9;
    u.ll.rotation.z = a; u.rl.rotation.z = -a;
    u.la.rotation.z = -a*.8; u.ra.rotation.z = a*.8;
    u.in.position.y = Math.abs(Math.cos(o._ph))*k*.9;
  }

  /* ---------- UI ---------- */
  const radarCtx = $('rdr').querySelector('canvas').getContext('2d');
  const zoneEl = $('zone'), moneyEl = $('money'), starsEl = $('stars');
  const hpEl = $('hp').querySelector('i'), arEl = $('ar').querySelector('i'), snEl = $('sn').querySelector('i');
  const hintEl = $('hint');

  function updateHUD(){
    document.body.classList.toggle('incar', !!P.car);
    const pp = P.car||P;
    // radar
    const W = 132, H = 132, R = W/2;
    radarCtx.clearRect(0,0,W,H);
    radarCtx.save();
    radarCtx.beginPath(); radarCtx.arc(R,R,R-2,0,TAU); radarCtx.clip();
    radarCtx.fillStyle = '#0a0e16'; radarCtx.fillRect(0,0,W,H);
    const scale = 3.6;
    const camYaw = state.cameraYaw;
    const rot = -camYaw - Math.PI/2;
    radarCtx.translate(R,R); radarCtx.rotate(rot);
    // draw zones
    const ppX = pp.x, ppY = pp.y;
    const tiles = [];
    for(let dy=-20;dy<=20;dy+=2) for(let dx=-20;dx<=20;dx+=2){
      const x = ppX + dx*T*1.5, y = ppY + dy*T*1.5;
      const tx = x/T|0, ty = y/T|0;
      if(tx<0||ty<0||tx>=N||ty>=N) continue;
      const t = World.M[ty*N+tx];
      let c = null;
      if(t===2) c = '#454b56'; else if(t===0||t===1) c = '#2b3140'; else if(t===3) c = '#1a3a5a';
      if(!c) continue;
      const sx = (x-ppX)*scale, sy = (y-ppY)*scale;
      radarCtx.fillStyle = c;
      radarCtx.fillRect(sx-6, sy-6, 12, 12);
    }
    radarCtx.restore();
    // markers in rotated space
    radarCtx.save();
    radarCtx.translate(R,R);
    const mark = (x,y,color,r=4)=>{
      let dx = (x-ppX)*scale, dy = (y-ppY)*scale;
      const c = Math.cos(rot), s = Math.sin(rot);
      const rx = dx*c - dy*s, ry = dx*s + dy*c;
      if(rx*rx+ry*ry > (R-4)*(R-4)) return;
      radarCtx.fillStyle = color;
      radarCtx.beginPath(); radarCtx.arc(rx,ry,r,0,TAU); radarCtx.fill();
    };
    // shops
    mark(SHP[0], SHP[1], '#ff2d95', 4);
    mark(DAN[0], DAN[1], '#38a0ff', 4);
    for(const c of cars) if(c.police) mark(c.x, c.y, '#3a8cff', 3);
    const tg = getTarget();
    if(tg) mark(tg[0], tg[1], tg[3]?'#38a0ff':'#ffd60a', 5);
    // player center
    radarCtx.fillStyle = '#fff';
    radarCtx.beginPath(); radarCtx.moveTo(0,-6); radarCtx.lineTo(-4,4); radarCtx.lineTo(4,4); radarCtx.closePath(); radarCtx.fill();
    radarCtx.restore();
    // zone
    zoneEl.textContent = state.interior ? state.interior.toUpperCase() : World.zoneName(pp.x, pp.y) + (World.tileAt(pp.x,pp.y)===0?' · ROAD':'');
    // money
    moneyEl.textContent = '$'+state.cash;
    // stars
    starsEl.textContent = state.wanted ? '★'.repeat(state.wanted) : '';
    // bars
    hpEl.style.width = Math.max(0,state.hp)+'%';
    arEl.style.width = Math.max(0,state.armor)+'%';
    snEl.style.width = Math.max(0,state.stamina)+'%';
    // hint
    let hint = '';
    if(!P.car && state.hasGun && state.clip===0 && state.ammo>0) hint = 'R — перезарядка';
    else if(P.car && P.car.hp<=0) hint = 'Машина сломана';
    else if(state.interior && P.y > (state.interior==='club'? 200 : 110)) hint = 'Выйти (E)';
    hintEl.textContent = hint;
    hintEl.style.display = hint?'block':'none';
  }

  /* ---------- Bullets 2D ---------- */
  const canvas2d = $('c'), ctx2d = canvas2d.getContext('2d');
  function drawBullets2D(){
    ctx2d.clearRect(0,0,canvas2d.width, canvas2d.height);
    for(const b of bullets){
      const a = proj(b.x1, 12, b.y1);
      const c = proj(b.x2, 12, b.y2);
      if(a[2]>1 && c[2]>1) continue;
      ctx2d.strokeStyle = 'rgba(255,230,120,'+ (b.life/.08) +')';
      ctx2d.lineWidth = 2;
      ctx2d.beginPath(); ctx2d.moveTo(a[0],a[1]); ctx2d.lineTo(c[0],c[1]); ctx2d.stroke();
    }
    // fx text
    ctx2d.font = 'bold 14px system-ui';
    for(const f of fx){
      const q = proj(f.x, 22, f.y);
      if(q[2]<1){ ctx2d.fillStyle = f.cash?'#7dff8a':'#aaa'; ctx2d.fillText(f.t, q[0]-14, q[1]); }
    }
  }
  function proj(x,y,z){
    const v = new THREE.Vector3(x,y,z).project(camera);
    return [(v.x+1)/2*canvas2d.width, (1-v.y)/2*canvas2d.height, v.z];
  }

  /* ---------- Missions engine ---------- */
  function missionStep(){
    const s = currentMission()?.s?.[state.missionStep];
    if(!s) return;
    const pp = P.car||P;
    if(s.k==='g'){
      if(hyp(pp.x-s.p[0]*T, pp.y-s.p[1]*T)<30){
        if(s.b) addCash(ri(5,25), pp.x, pp.y-20);
        advanceMission();
      }
    } else if(s.k==='c'){
      if(P.car === missionCar) advanceMission();
    } else if(s.k==='v'){
      if(P.car && hyp(P.car.x-s.p[0]*T, P.car.y-s.p[1]*T)<44 && hyp(P.car.vx,P.car.vy)<80) advanceMission();
    } else if(s.k==='f'){
      if(missionTargets.every(p=>p.ko||p.hp<=0)) advanceMission();
    }
  }

  function currentMission(){ return state.currentMission; }
  let missionCar = null, missionTargets = [];

  function startMissionStep(){
    const s = currentMission()?.s?.[state.missionStep];
    if(!s){ finishMission(); return; }
    if(s.k==='d'){ openDialog(s.l, advanceMission); }
    else if(s.k==='c'){
      missionCar = spawnCar(s.ty, s.p[0]*T, s.p[1]*T, 0, {mission:true});
    }
    else if(s.k==='f'){
      missionTargets = [];
      for(let i=0;i<s.n;i++){
        const q = safeSpot(s.p[0]*T, s.p[1]*T);
        missionTargets.push(spawnPed(q[0], q[1], {h:true}));
      }
    }
    else if(s.k==='w'){ addWanted(s.n); advanceMission(); }
    else if(s.k==='p'){ addCash(s.v||rr()+25, P.x, P.y-20); if(s.x) toastHigh(s.x); advanceMission(); }
    else if(s.k==='ch'){ openChoice(); }
    else if(s.k==='e'){ finishMission(); }
  }

  function advanceMission(){
    state.missionStep++;
    if(state.missionStep >= currentMission().s.length){ finishMission(); return; }
    startMissionStep();
  }

  function startMission(idx){
    state.currentMission = MISS[idx];
    state.missionIndex = idx;
    state.missionStep = 0;
    state.dialogActive = false;
    startMissionStep();
  }

  function finishMission(){
    const idx = state.missionIndex;
    state.currentMission = null;
    if(idx===0){ state.progress = 1; toastNormal('Дэниел: Заходи в мотель, когда будешь готов к настоящей работе.', 'dan'); }
    else { state.missionIndex = idx; if(idx===5) endScreen(); else toastNormal('Дэниел: Новое задание ждёт у мотеля.', 'dan'); }
    save();
  }

  function openDialog(lines, cb){
    state.dialogActive = true;
    let i = 0;
    const d = $('dg');
    const render = ()=>{
      const [who, txt] = lines[i];
      d.style.display = 'block';
      d.innerHTML = `<div class="who">${who}</div><div class="txt">${txt}</div><div class="row"><span>E / касание — далее</span><button onclick="event.stopPropagation();Game.skipDialog()">Пропустить ⏭</button></div>`;
    };
    render();
    state.dialogNext = ()=>{
      i++;
      if(i>=lines.length){ d.style.display='none'; state.dialogActive=false; cb(); }
      else render();
    };
    d.onpointerdown = ()=>state.dialogNext();
  }
  function skipDialog(){
    while(state.dialogActive) state.dialogNext();
  }

  function openChoice(){
    const ov = $('ov');
    ov.style.display = 'flex';
    ov.innerHTML = `<h1>Выбор</h1><div class="sub">Что сделает Алекс?</div>
      <button onclick="Game.choose(1)">A: Продолжить с Дэниелом</button>
      <button class="alt" onclick="Game.choose(2)">B: Уйти и начать своё дело</button>`;
  }
  function choose(c){
    state.choice = c;
    $('ov').style.display='none';
    if(c===1) openDialog([['Алекс','Ладно. Но больше никаких секретов.'],['Дэниел','Договорились, партнёр.']], advanceMission);
    else openDialog([['Алекс','Дальше я сам. Не ищи меня.'],['Дэниел','Ты ещё пожалеешь...']], advanceMission);
  }

  function endScreen(){
    const ov = $('ov');
    ov.style.display='flex';
    ov.innerHTML = `<h1>THE LAST CHANCE</h1><div class="sub">Конец демоверсии.<br>Итог: ${state.choice===1?'вы остались с Дэниелом':'вы пошли своим путём'}.<br>Город открыт для свободной игры.</div><button onclick="Game.closeOverlay()">Продолжить игру</button>`;
  }
  function closeOverlay(){ $('ov').style.display='none'; }

  function getTarget(){
    const s = currentMission()?.s?.[state.missionStep];
    if(s?.p) return [s.p[0]*T, s.p[1]*T, s.k==='v'?44:30];
    if(!currentMission() && state.progress && state.missionIndex<5) return [DAN[0], DAN[1], 30, 1];
    return null;
  }

  /* ---------- Player death ---------- */
  function wasted(){
    const penalty = Math.min(state.cash, Math.floor(state.cash*.1));
    toastHigh('ВАС ВЗЯЛИ / WASTED — штраф $'+penalty);
    state.cash -= penalty;
    P.hp = 100; P.x = 3.5*T; P.y = 2.5*T; P.dead = false;
    state.wanted = 0; P.car = null;
    cars.forEach(c=>{if(c.police) c.hp=0;});
    for(const p of peds) if(p.h) p.ko = .1;
    if(currentMission()){
      state.missionStep = state.missionIndex>0 ? 1 : 0;
      currentMission() && startMissionStep();
    }
  }

  /* ---------- Save/Load ---------- */
  function save(){
    try{
      localStorage.setItem('vcr3', JSON.stringify({
        cash:state.cash, wanted:state.wanted, hp:P.hp, hasGun:state.hasGun, clip:state.clip, ammo:state.ammo,
        pos: state.interior? [state.interiorRet[0],state.interiorRet[1]] : [P.car?P.car.x:P.x, P.car?P.car.y:P.y],
        missionIndex:state.missionIndex, missionStep:state.missionStep, progress:state.progress, choice:state.choice
      }));
      toastNormal('Игра сохранена', 'save');
    }catch(e){}
  }
  function load(){
    try{
      const d = JSON.parse(localStorage.getItem('vcr3'));
      if(!d) return;
      Object.assign(state, {cash:d.cash, wanted:d.wanted, hasGun:d.hasGun, clip:d.clip, ammo:d.ammo,
        missionIndex:d.missionIndex, missionStep:d.missionStep, progress:d.progress, choice:d.choice});
      P.hp = d.hp; P.x = d.pos[0]; P.y = d.pos[1];
    }catch(e){}
  }

  /* ---------- Interior ---------- */
  const IR = { bar:{w:240,d:190,bg:'#4a1f6e',neon:'#ff2d95'}, food:{w:230,d:180,bg:'#7a3a2a',neon:'#ffcc33'},
    shop:{w:240,d:190,bg:'#245a7a',neon:'#33e0ff'}, lobby:{w:220,d:180,bg:'#6a4a2a',neon:'#ffaa44'},
    club:{w:420,d:300,bg:'#2a0e55',neon:'#ff2dd0'} };
  let interiorGroup = null;
  const interiorRet = [0,0], interiorPrevA = 0;
  const interiorTarget = {x:0,z:0};

  function enterInterior(kind, name){
    if(!interiorGroup) buildInterior();
    configureInterior(kind);
    state.interior = kind;
    state.interiorName = name;
    interiorRet[0] = P.x; interiorRet[1] = P.y + 10;
    interiorPrevA = P.a;
    P.x = 0; P.y = (IR[kind].d/2)-26; P.a = -1.57;
    K.fire = 0;
    toastNormal('Вы вошли: '+name, 'enter');
  }
  function exitInterior(){
    P.x = interiorRet[0]; P.y = interiorRet[1]; P.a = interiorPrevA;
    state.interior = null;
    toastNormal('', 'exit');
  }

  function buildInterior(){
    // For brevity, keep a minimal interior — bar/club essentials
    interiorGroup = new THREE.Group();
    const Q = { g:{} };
    Q.floor = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshLambertMaterial({color:'#2a1a3a'}));
    Q.floor.rotation.x = -Math.PI/2;
    Render.iscene.add(Q.floor);
    Q.wallMat = new THREE.MeshLambertMaterial({color:'#4a1f6e'});
    Q.neonMat = new THREE.MeshBasicMaterial({color:'#ff2d95'});
    Q.lights = [new THREE.PointLight(0xff2d95,1.8,380), new THREE.PointLight(0x8a2be2,1.8,380)];
    Q.lights.forEach(l=>Render.iscene.add(l));
    Render.iscene.add(new THREE.AmbientLight(0xffffff,.55));
    // walls
    Q.walls = [0,1,2].map(()=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), Q.wallMat); Render.iscene.add(m); return m; });
    // dance floor + bar
    Q.df = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({map:Render.canvasTex(256,256,(x)=>{
      for(let i=0;i<8;i++)for(let j=0;j<8;j++){x.fillStyle=['#ff2dd0','#7a2cff','#2dd4ff','#2a0e55'][(i*3+j*5)%4];x.fillRect(i*32,j*32,30,30);}
    })}));
    Q.df.rotation.x = -Math.PI/2; Render.iscene.add(Q.df);
    const bar = new THREE.Mesh(new THREE.BoxGeometry(160,16,14), Render.mat('#3a2a1a')); bar.position.set(0,8,0); Render.iscene.add(bar);
    const bt = new THREE.Mesh(new THREE.BoxGeometry(164,2,18), Render.mat('#1a1a1a')); bt.position.set(0,17,0); Render.iscene.add(bt);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(10,16,12), new THREE.MeshPhongMaterial({color:0xcccccc, shininess:90})); ball.position.set(0,110,30); Render.iscene.add(ball);
    Q.ball = ball;
    interiorGroup.userData = Q;
  }

  function configureInterior(kind){
    const Q = interiorGroup.userData, cfg = IR[kind];
    Q.floor.scale.set(cfg.w, cfg.d, 1);
    Q.floor.material.color.set(kind==='club'?'#16081f':cfg.bg);
    Q.wallMat.color.set(cfg.bg);
    Q.neonMat.color.set(cfg.neon);
    Q.lights[0].color.set(cfg.neon);
    Q.walls[0].scale.set(cfg.w, 70, 6); Q.walls[0].position.set(0,35,-cfg.d/2);
    Q.walls[1].scale.set(6,34,cfg.d); Q.walls[1].position.set(-cfg.w/2,17,0);
    Q.walls[2].scale.set(6,34,cfg.d); Q.walls[2].position.set(cfg.w/2,17,0);
    Q.df.scale.set(kind==='club'?130:cfg.w*.7, kind==='club'?130:cfg.d*.7, 1);
    Q.df.position.set(0,.3, kind==='club'?30:0);
    Q.df.visible = true;
    interiorTarget.x = 0; interiorTarget.z = cfg.d/2 - 30;
    state.interiorDim = cfg;
  }

  function updateInterior(dt){
    const cfg = IR[state.interior];
    const ax = (K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+(Joystick.x||0);
    const ay = (K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0)+(Joystick.y||0);
    const l = hyp(ax,ay);
    if(l>.1){
      const sp = (K.ShiftLeft?120:80)/Math.max(l,1)*dt;
      const nx = clamp(P.x + ax*sp, -cfg.w/2+10, cfg.w/2-10);
      const ny = clamp(P.y + ay*sp, -cfg.d/2+14, cfg.d/2-6);
      P.x = nx; P.y = ny;
      P.a = Math.atan2(ay,ax);
    }
    if(P.y > cfg.d/2 - 30 && Math.abs(P.x) < 40){ exitInterior(); return; }
    // interaction with bartender
    if(hyp(P.x, P.y - interiorTarget.z) < 60){
      const c = {bar:[10,'+25 HP',25], food:[12,'+35 HP',35], shop:[15,'Патроны +12',0], lobby:[30,'Отдых: полное HP',100], club:[25,'Коктейль +15',15]}[state.interior];
      if(S && S.interactCD<=0){
        // handled by E press
      }
    }
  }

  function interactInterior(){
    const cfg = IR[state.interior];
    const c = {bar:[10,'+25 HP',25], food:[12,'+35 HP',35], shop:[15,'Патроны +12',0], lobby:[30,'Отдых: полное HP',100], club:[25,'Коктейль +15',15]}[state.interior];
    if(state.cash < c[0]){ toastHigh('Недостаточно денег'); return; }
    if(state.interior==='shop'){ if(!state.hasGun){ toastHigh('Нужен пистолет'); return; } state.ammo += 12; }
    else P.hp = Math.min(100, P.hp + c[2]);
    state.cash -= c[0];
    toastNormal(c[1], 'interact');
    Audio.sfx('cash');
  }

  function renderInterior(dt, now){
    const Q = interiorGroup.userData, cfg = IR[state.interior];
    const cam = Render.icam;
    cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
    // player model
    if(player){
      player.mesh.position.set(P.x, 0, P.y);
      player.mesh.rotation.y = -P.a;
      walkAnim(player.mesh, player, dt);
    }
    // lights animation
    Q.lights[0].intensity = 1.6 + (state.interior==='club'? Math.sin(now/200)*.9 : Math.sin(now/400)*.3);
    Q.lights[1].intensity = 1.6 + (state.interior==='club'? Math.cos(now/180)*.9 : 0);
    Q.lights[0].position.set(state.interior==='club'? Math.sin(now/700)*120 : -60, 90, 0);
    Q.ball.rotation.y = now/1500;
    cam.position.set(P.x*.6, 135 + (state.interior==='club'?60:0), P.y + 115);
    cam.lookAt(P.x*.6, 0, P.y - 16);
    Render.renderer.render(Render.iscene, cam);
    drawBullets2D();
  }

  /* ---------- Input ---------- */
  const Mouse = {x: innerWidth/2, y: innerHeight/2};
  let TouchAimActive = false, TouchAimTarget = null;
  const Joystick = {x:0,y:0};

  function bindInput(){
    addEventListener('keydown', e=>{
      if(e.code==='Escape'){ togglePause(); e.preventDefault(); return; }
      K[e.code] = 1;
      if(e.code==='KeyR') startReload();
      if(e.code==='KeyE') interact();
      if(e.code==='KeyF') vehicleEnter();
      if(e.code==='KeyQ') cycleWeapon();
      if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    });
    addEventListener('keyup', e=>{ K[e.code] = 0; });
    addEventListener('mousemove', e=>{ Mouse.x=e.clientX; Mouse.y=e.clientY; });
    addEventListener('mousedown', e=>{ if(e.button===0) K.fire = 1; if(e.button===2) K.aim = 1; });
    addEventListener('mouseup', e=>{ if(e.button===0) K.fire = 0; if(e.button===2) K.aim = 0; });
    addEventListener('contextmenu', e=>e.preventDefault());

    // touch
    if('ontouchstart' in window){
      document.body.classList.add('tch');
      const jb = $('jb');
      const cv = $('c');
      cv.addEventListener('touchstart', e=>{
        const t = e.touches[0];
        if(t.clientX < innerWidth/2 && t.clientY > innerHeight/2){
          Joystick.active = true; Joystick.startX = t.clientX; Joystick.startY = t.clientY;
          jb.style.display='block'; jb.style.left = t.clientX+'px'; jb.style.top = t.clientY+'px';
        } else {
          TouchAimActive = true;
          TouchAimTarget = {x: P.x + Math.cos(state.cameraYaw)*100, y: P.y + Math.sin(state.cameraYaw)*100};
        }
      }, {passive:true});
      cv.addEventListener('touchmove', e=>{
        if(Joystick.active){
          const t = e.touches[0];
          Joystick.x = clamp((t.clientX - Joystick.startX)/60, -1, 1);
          Joystick.y = clamp((t.clientY - Joystick.startY)/60, -1, 1);
          jb.querySelector('i').style.left = (35 + Joystick.x*30)+'px';
          jb.querySelector('i').style.top = (35 + Joystick.y*30)+'px';
        }
      }, {passive:true});
      cv.addEventListener('touchend', ()=>{
        Joystick.active = false; Joystick.x = Joystick.y = 0;
        jb.style.display='none'; jb.querySelector('i').style.left='35px'; jb.querySelector('i').style.top='35px';
        TouchAimActive = false;
      });
      document.querySelectorAll('#tb button, #tl button').forEach(b=>{
        const key = b.dataset.k || b.dataset.a;
        if(!key) return;
        b.addEventListener('touchstart', e=>{ e.preventDefault(); K[key] = 1; if(key==='KeyE') interact(); if(key==='KeyF') vehicleEnter(); if(key==='KeyR') startReload(); if(key==='KeyQ') cycleWeapon(); }, {passive:false});
        b.addEventListener('touchend', e=>{ e.preventDefault(); K[key] = 0; }, {passive:false});
      });
    }
    // buttons
    $('pause').addEventListener('click', e=>{ if(e.target.tagName!=='BUTTON') return; });
  }

  function togglePause(){
    if(state.started && !state.cutscene){
      state.paused = !state.paused;
      $('pause').style.display = state.paused?'flex':'none';
    }
  }
  function cycleWeapon(){
    if(state.hasGun) state.equipped = state.equipped? 0 : 1;
  }

  function vehicleEnter(){
    if(P.car){
      const c = P.car;
      if(c.t>10){
        for(const r of [26,44,62,80]) for(let a=0;a<16;a++){
          const x = c.x + Math.cos(a*.39)*r, y = c.y + Math.sin(a*.39)*r;
          if(World.walkable(x,y)){ P.x=x; P.y=y; P.car=null; return; }
        }
        toastNormal('Причальте к берегу', 'dock'); return;
      }
      for(const s of [1,-1]){
        const x = c.x + Math.cos(c.a+1.57*s)*24, y = c.y + Math.sin(c.a+1.57*s)*24;
        if(!World.solidR(x,y,6)){ P.x=x; P.y=y; P.car=null; return; }
      }
      P.x = c.x; P.y = c.y; P.car = null; return;
    }
    let best = null, bd = 46;
    for(const c of cars){
      if(c.police) continue;
      const d = hyp(c.x-P.x, c.y-P.y) - (c.t>10? c.t*2.5 : 0);
      if(d < bd){ bd = d; best = c; }
    }
    if(!best) return;
    if(best.mission) best.ai = 0;
    else if(best.ai){ addWanted(1); best.ai = 0; best.vx = Math.cos(best.a)*best.sp; best.vy = Math.sin(best.a)*best.sp;
      const p = spawnPed(best.x, best.y); p.panic = 6; }
    P.car = best;
    state.carsStolen++;
    Audio.sfx('horn');
  }

  function interact(){
    if(state.dialogActive){ state.dialogNext && state.dialogNext(); return; }
    if(state.interior){ interactInterior(); return; }
    const pp = P.car||P;
    if(hyp(pp.x-SHP[0], pp.y-SHP[1]) < 44){ openShop(); return; }
    if(!currentMission() && state.progress && state.missionIndex<5 && hyp(pp.x-DAN[0], pp.y-DAN[1])<44 && !P.car){
      startMission(state.missionIndex);
      return;
    }
    // interior
    const near = interiorDoorNear(pp.x, pp.y);
    if(near) enterInterior(near.kind, near.name);
  }
  function interiorDoorNear(x,y){
    for(const g of Object.values(Render.groups)){
      if(!g.userData.doors) continue;
      for(const d of g.userData.doors) if(hyp(x-d[0], y-d[1])<26) return d[2];
    }
  }

  function openShop(){
    const ov = $('ov');
    ov.style.display = 'flex';
    ov.innerHTML = `<h1>GUN & CLOTHES</h1><div class="sub">Баланс: $${state.cash}</div>
      ${!state.hasGun?'<button onclick="Game.buy(0)">Пистолет — $150</button>':''}
      <button class="alt" onclick="Game.buy(1)">Патроны +24 — $30</button>
      <button class="alt" onclick="Game.buy(2)">Сменить цвет — $50</button>
      <button class="alt" onclick="Game.closeOverlay()">Выйти</button>`;
  }
  function buy(i){
    const c=[150,30,50][i];
    if(state.cash<c){ toastHigh('Недостаточно денег'); return; }
    if(i===1 && !state.hasGun){ toastHigh('Сначала купите пистолет'); return; }
    state.cash -= c;
    if(i===0){ state.hasGun = true; state.equipped = 1; state.clip = 12; state.ammo = 24; }
    else if(i===1) state.ammo += 24;
    else state.sk = (state.sk||0+1)%4;
    save();
    openShop();
  }

  /* ---------- Intro / cutscene ---------- */
  function updateIntro(dt){
    state.intro -= dt;
    if(state.intro<=0){
      if(currentMission()) toastNormal(MISS[0].s[0].t, 'dan');
    }
  }

  /* ---------- Start ---------- */
  let DN = {};
  function init(){
    World.generate();
    Render.buildWorld();

    // player model
    player = {mesh: Render.playerModel()};
    Render.scene.add(player.mesh);

    // Daniel NPC
    DN.mesh = Render.pedModel({sk:1});
    DN.mesh.userData.t.material = Render.mat('#38a0ff');
    DN.mesh.position.set(DAN[0]+10, 0, DAN[1]);
    Render.scene.add(DN.mesh);

    // labels
    addLabel('GUN SHOP', '#ff3d9a', SHP[0], 46, SHP[1]);
    addLabel('MOTEL', '#38a0ff', DAN[0], 46, DAN[1]);
    addLabel('BUS STOP', '#fff', 3.5*T, 32, 2.5*T);
    addLabel('STRIP CLUB', '#ff2d95', 94*T-6, 92, 16*T);

    // pre-spawn
    for(let i=0;i<8;i++) spawnParked();
    spawnCar(11, 2200, 880, 0, {mission:true});
    spawnCar(12, 2200, 1488, 0, {mission:true});
    spawnCar(13, 75*T, 70*T, 0, {mission:true});
    spawnCar(13, 86*T, 76*T, Math.PI, {mission:true, ai:3});
    spawnCar(11, 70*T, 30*T, 1, {mission:true, ai:3});

    // load
    load();

    bindInput();
    resize(); addEventListener('resize', resize);

    // startscreen
    const ov = $('ov');
    ov.style.display = 'flex';
    ov.innerHTML = `<h1>VICE CITY: REBORN</h1><div class="sub">Город возвращается. Алекс Морган — снова на улицах.</div>
      <button onclick="Game.begin()">Начать</button>
      <button class="alt" onclick="Game.beginContinue()">Продолжить</button>
      <button class="alt" onclick="Game.toggleAudio()">Звук: вкл</button>`;
  }

  function addLabel(t, c, x, y, z){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({map: Render.canvasTex(160,52,(g,w,h)=>{
      g.fillStyle='#000a'; g.fillRect(0,0,w,h); g.strokeStyle=c; g.lineWidth=3; g.strokeRect(2,2,w-4,h-4);
      g.fillStyle=c; g.font='bold 22px sans-serif'; g.textAlign='center'; g.fillText(t,w/2,32);
    }), transparent:true, fog:false}));
    s.scale.set(52,16,1); s.position.set(x,y,z); Render.scene.add(s);
  }

  let last = performance.now(), acc = 0, FIXED = 1/60;
  function loop(){
    const now = performance.now();
    let frameDt = Math.min(.05, (now-last)/1000);
    last = now;
    if(state.paused){ requestAnimationFrame(loop); return; }
    if(state.cutscene){ updateCutscene(frameDt); renderSceneCommon(frameDt, now); requestAnimationFrame(loop); return; }

    acc += frameDt;
    while(acc >= FIXED){
      tick(FIXED);
      acc -= FIXED;
    }
    // render
    frame++;
    if(state.interior) renderInterior(frameDt, now);
    else renderSceneCommon(frameDt, now);
    updateHUD();
    Audio.music(frameDt);
    requestAnimationFrame(loop);
  }

  function tick(dt){
    state.time = (state.time||0) + dt;
    state.minutes = (state.minutes + dt/25) % 24;
    state.intro = Math.max(0, state.intro - dt);
    if(state.intro>0){ updateIntro(dt); return; }
    if(state.interior){ updateInterior(dt); return; }
    updatePlayer(dt);
    World.bridgeTick(state.time);
    updateEntities(dt);
    spawnMgr(dt);
    missionStep();
    // engine sound
    Audio.engineUpdate(P.car? hyp(P.car.vx,P.car.vy) : 0, !!P.car);
  }

  function renderSceneCommon(dt, now){
    render(dt, now);
  }

  function updateCutscene(dt){
    state.cutsceneT += dt;
    // simple intro pan
    const t = state.cutsceneT;
    Render.camera.position.set(30 + t*5, 48, 140);
    Render.camera.lookAt(112, 14, 60);
    if(t>=4){ state.cutscene = false; state.paused = false; }
  }

  function begin(){
    Audio.init();
    $('ov').style.display = 'none';
    state.paused = false;
    state.started = true;
    state.cutscene = true;
    state.cutsceneT = 0;
    state.intro = 3.5;
    // player teleport to intro spot
    P.x = 112; P.y = 58; P.a = 1.57; P.hidden = 1;
    setTimeout(()=>{ P.hidden = 0; P.x = 3.5*T; P.y = 2.5*T; P.a = .3; state.intro = 0; if(!currentMission() && state.missionIndex===0){ startMission(0); } }, 3500);
    requestAnimationFrame(loop);
  }
  function beginContinue(){
    Audio.init();
    $('ov').style.display = 'none';
    state.paused = false;
    state.started = true;
    requestAnimationFrame(loop);
  }
  function toggleAudio(){
    Audio.toggle('s');
    toastNormal(Audio.sn.s? 'Звук включён' : 'Звук выключен', 'audio');
  }

  function skipCutscene(){ state.cutscene = false; state.paused = false; state.intro = 0; P.hidden = 0; P.x = 3.5*T; P.y = 2.5*T; P.a = .3; if(state.missionIndex===0 && !currentMission()) startMission(0); }

  return {
    init, begin, beginContinue, togglePause, save, load, toggleAudio, skipCutscene,
    startMission, advanceMission, buy, closeOverlay, choose, skipDialog,
    get cars(){return cars}, get peds(){return peds},
    get player(){return P}, state
  };
})();

/* ---------------- Entry ---------------- */
Game.init();
</script></body></html>
