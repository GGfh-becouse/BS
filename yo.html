<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VICE CITY: REBORN 3D</title>
<style>
:root{color-scheme:dark;--p:env(safe-area-inset-top,0px);--b:env(safe-area-inset-bottom,0px);
--pink:#ff2d95;--cyan:#2dd4ff;--gold:#ffd60a;--glass:rgba(10,12,20,.55);--stroke:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;font:600 13px/1.35 system-ui,sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.h{position:fixed;pointer-events:none;text-shadow:0 1px 4px #000}
/* radar */
#rdr{left:12px;top:calc(var(--p) + 12px);width:132px;height:132px;border-radius:50%;border:2px solid rgba(255,255,255,.55);
background:radial-gradient(circle at 50% 50%,rgba(8,12,20,.92),rgba(4,6,10,.98));box-shadow:0 6px 24px #000a,inset 0 0 18px #0008}
#rdr canvas{width:100%;height:100%;border-radius:50%}
#zone{left:14px;top:calc(var(--p) + 150px);font-size:10px;letter-spacing:2px;opacity:.85}
/* status */
#st{right:14px;top:calc(var(--p) + 12px);text-align:right;min-width:180px}
#money{font:800 22px system-ui;color:#7dff8a;letter-spacing:.5px}
#stars{margin-top:4px;font-size:16px;letter-spacing:3px;color:#ffd60a;min-height:20px}
#bars{margin-top:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.bar{width:150px;height:7px;background:#000a;border:1px solid var(--stroke);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .18s ease,background .2s}
#hp i{background:linear-gradient(90deg,#ff5b5b,#ff2d2d)}
#ar i{background:linear-gradient(90deg,#4fc3ff,#2d8cff)}
#sn i{background:linear-gradient(90deg,#ffe066,#ffb300)}
/* toast / banner */
#toast{left:50%;top:calc(var(--p) + 16px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;max-width:min(92vw,560px)}
.t{background:var(--glass);border:1px solid var(--stroke);border-left:3px solid var(--pink);border-radius:10px;padding:8px 14px;font-size:13px;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;backdrop-filter:blur(6px)}
.t.show{opacity:1;transform:none}
.t.low{border-left-color:var(--cyan)}
.t.high{border-left-color:var(--gold)}
#hint{left:50%;bottom:calc(var(--b) + 96px);transform:translateX(-50%);background:var(--glass);border:1px solid var(--stroke);border-radius:10px;padding:7px 14px;font-size:12px;display:none;backdrop-filter:blur(6px)}
/* dialog */
#dg{position:fixed;left:50%;bottom:calc(var(--b) + 24px);transform:translateX(-50%);width:min(92vw,640px);
background:linear-gradient(180deg,rgba(8,10,18,.92),rgba(8,10,18,.98));border:1px solid var(--stroke);border-radius:14px;padding:14px 16px;display:none;backdrop-filter:blur(8px)}
#dg .who{color:var(--pink);font:800 14px system-ui;letter-spacing:.5px}
#dg .txt{margin-top:6px;font-weight:500;font-size:14px;line-height:1.45}
#dg .row{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:11px;opacity:.7}
#dg button{font:700 12px system-ui;color:#fff;background:#ffffff14;border:1px solid var(--stroke);border-radius:8px;padding:6px 12px}
/* overlay menus */
#ov{position:fixed;inset:0;background:rgba(3,5,10,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;overflow:auto;backdrop-filter:blur(10px)}
#ov h1{margin:0;font:900 30px system-ui;color:var(--pink);letter-spacing:2px;text-shadow:0 0 18px #ff2d9580}
#ov .sub{opacity:.7;font-weight:500;margin-bottom:6px}
#ov button{font:800 15px system-ui;color:#fff;background:linear-gradient(180deg,#ff3da0,#d81b7a);border:0;border-radius:12px;padding:12px 20px;min-width:240px;box-shadow:0 8px 24px #ff2d9540}
#ov button.alt{background:#ffffff12;border:1px solid var(--stroke);box-shadow:none}
/* touch */
#tb{position:fixed;right:14px;bottom:calc(var(--b) + 96px);display:none;grid-template-columns:repeat(2,62px);gap:10px}
#tl{position:fixed;left:14px;bottom:calc(var(--b) + 96px);display:none;gap:12px}
#tb button,#tl button{min-width:0;width:62px;height:62px;border-radius:50%;padding:0;font-size:20px;color:#fff;background:#ffffff14;border:1px solid var(--stroke);backdrop-filter:blur(4px);touch-action:none}
#tl button{width:78px;height:78px}
.tch #tb{display:grid}.tch.incar #tl{display:flex}
.c{display:none}.incar .c{display:block}.incar .f{display:none}
#jb{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border:2px solid #ffffff44;border-radius:50%;display:none;pointer-events:none;backdrop-filter:blur(2px)}
#jb i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#ffffff55;border:1px solid #fff8}
#sk{position:fixed;right:14px;bottom:calc(var(--b) + 16px);display:none;z-index:5;font:800 14px system-ui;color:#fff;background:#000a;border:1px solid var(--stroke);border-radius:10px;padding:10px 16px}
.cs #tb,.cs #tl,#hint{display:none!important}
.cs #hint{display:none!important}
#pause{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:22px 26px;backdrop-filter:blur(10px)}
#pause button{font:800 14px system-ui;color:#fff;background:linear-gradient(180deg,#ff3da0,#d81b7a);border:0;border-radius:10px;padding:10px 18px;min-width:200px}
#pause button.alt{background:#ffffff12;border:1px solid var(--stroke)}
</style></head><body>
<canvas id="c"></canvas>
<div id="rdr" class="h"><canvas width="132" height="132"></canvas></div>
<div id="zone" class="h"></div>
<div id="st" class="h">
  <div id="money">$0</div>
  <div id="stars"></div>
  <div id="bars">
    <div class="bar" id="hp"><i style="width:100%"></i></div>
    <div class="bar" id="ar"><i style="width:0%"></i></div>
    <div class="bar" id="sn"><i style="width:100%"></i></div>
  </div>
</div>
<div id="toast" class="h"></div>
<div id="hint"></div>
<div id="dg"></div>
<div id="ov"></div>
<div id="pause">
  <div style="font:900 20px system-ui;color:var(--pink);letter-spacing:1px">ПАУЗА</div>
  <button onclick="Game.togglePause()">Продолжить</button>
  <button class="alt" onclick="Game.save()">Сохранить</button>
  <button class="alt" onclick="location.reload()">Перезапустить</button>
</div>
<button id="sk" onclick="Game.skipCutscene()">Пропустить ▶▶</button>
<div id="jb"><i></i></div>
<div id="tl">
  <button data-k="KeyA">◀</button><button data-k="KeyD">▶</button>
</div>
<div id="tb">
  <button class="f" data-k="fire">👊</button>
  <button class="f" data-k="aim">🎯</button>
  <button class="c" data-k="KeyW">⬆</button>
  <button class="f" data-k="ShiftLeft">🏃</button>
  <button class="c" data-k="KeyS">⬇</button>
  <button data-a="KeyF">F</button>
  <button data-a="KeyE">E</button>
  <button class="f" data-a="KeyR">R</button>
  <button class="c" data-k="Space">🛑</button>
  <button class="f" data-a="KeyQ">Q</button>
  <button data-a="Escape">☰</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ============================================================
   VICE CITY: REBORN 3D — rebuilt
   Слои: Engine / World / Entities / AI / Anim / Audio / UI
   ============================================================ */
const TAU = Math.PI * 2, T = 32, N = 100;
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const hyp = Math.hypot;
const rnd = (a,b)=>a+Math.random()*(b-a);
const ri = (a,b)=>Math.floor(rnd(a,b+1));
const wrap = a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a};
const smooth = t=>t*t*(3-2*t);
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};

/* ---------------- Notification Manager ---------------- */
const Notify = (()=>{
  const items = new Map(); // id -> {t, until}
  const queue = [];
  let lastHigh = 0;
  function push(text, {id='x', priority='normal', cooldown=0, duration=2.6}={}){
    const now = performance.now()/1000;
    const rec = items.get(id);
    if(rec && now - rec.t < cooldown) return false;
    if(priority==='high'){
      if(now - lastHigh < 1.2) return false;
      lastHigh = now;
      queue.length = 0;
    }
    items.set(id, {t:now, until:now+duration});
    queue.push({text, priority, until:now+duration});
    if(queue.length>4) queue.shift();
    render();
    return true;
  }
  function render(){
    const box = $('toast');
    box.innerHTML = queue.map(q=>`<div class="t show ${q.priority==='low'?'low':q.priority==='high'?'high':''}">${q.text}</div>`).join('');
  }
  setInterval(()=>{
    const now = performance.now()/1000;
    let changed = false;
    for(let i=queue.length-1;i>=0;i--){ if(queue[i].until<now){queue.splice(i,1);changed=true;} }
    if(changed) render();
  }, 300);
  return {push};
})();

/* ---------------- World ---------------- */
const World = (()=>{
  const M = new Uint8Array(N*N), H = new Uint8Array(N*N), CV = new Uint8Array(N*N);
  const hash = (a,b)=>{let h=Math.imul(a+1,374761393)^Math.imul(b+7,668265263);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)%1000/1000};
  const zoneOf = (bx,by)=> bx>=5?'c' : bx>=2&&bx<=3&&by>=2&&by<=3?'d' : by>=4&&bx<=3?'i' : by<=1?'s':'r';

  function generate(){
    M.fill(0); H.fill(0); CV.fill(0);
    for(let ty=0;ty<N;ty++)for(let tx=0;tx<N;tx++){
      const i=ty*N+tx, lx=tx%10-2, ly=ty%10-2;
      let t=0, h=0;
      if(lx>=0&&ly>=0){
        const bx=tx/10|0, by=ty/10|0, d=zoneOf(bx,by), r=hash(bx*9+(lx>>2),by*7+(ly>>2));
        if(d==='c'){ t=lx>=4?5:lx==0?1:(by%2===0&&lx<3&&ly>0&&ly<7)?2:5; h=56; }
        else if(lx===0||ly===0||lx===7||ly===7) t=1;
        else if(d==='d'){ t=(bx===3&&by===3&&ly>3)?1:2; h=50+r*70; }
        else if(d==='i'){ t=ly<4?2:1; h=34; }
        else { const u=(lx-1)/3|0, v=(ly-1)/3|0, ox=(lx-1)%3, oy=(ly-1)%3;
          t=(ox<2&&oy<2&&hash(bx*13+u,by*17+v)>(d==='s'?.45:.2))?2:4; h=d==='s'?20:28; }
        CV[i]=hash(tx,ty)*8|0;
      }
      M[i]=t; H[i]=h;
    }
    // special plots
    for(let ty=0;ty<N;ty++)for(let tx=0;tx<N;tx++){
      const i=ty*N+tx, bx=tx/10|0, by=ty/10|0, lx=tx%10-2, ly=ty%10-2;
      if(lx<0||ly<0) continue;
      if(bx===1&&by===3&&lx>0&&lx<7&&ly>0&&ly<7){M[i]=lx>=2&&lx<=4&&ly>=2&&ly<=4?3:4;H[i]=0;}
      if(bx===0&&by===3&&lx>0&&lx<7&&ly>0&&ly<7){M[i]=1;H[i]=0;}
      if(bx===2&&by===2&&lx>=2&&lx<=5&&ly>=2&&ly<=5)H[i]=210;
      if(bx===5&&(by===2||by===4)&&lx>=4&&ly>=(by===2?3:2)&&ly<=(by===2?4:3))M[i]=1;
    }
    // island & bridge
    for(let ty=0;ty<N;ty++)for(let tx=0;tx<N;tx++){
      const i=ty*N+tx; if(tx<60&&ty<60) continue;
      let t=3; H[i]=0;
      if((tx<65&&ty<60)||(ty<65&&tx<60)) t=5;
      if(tx>=87&&ty>=7&&ty<37) t=5;
      if(tx<71&&tx>=60&&(ty===25||ty===26||ty===44||ty===45)) t=1;
      if(ty===20||ty===21) t=0;
      if(tx>=92&&ty>=12&&ty<32&&t!==0){
        t=4;
        if((tx<=93&&ty>=13&&ty<=19)||(ty>=22&&ty<=25)) t=1;
        if(tx>=94&&ty>=13&&ty<=19){t=2;H[i]=32;CV[i]=8;}
      }
      M[i]=t;
    }
  }

  const isWater = (x,y)=>{const tx=x/T|0, ty=y/T|0; return x>=0&&y>=0&&tx<N&&ty<N&&M[ty*N+tx]===3;};
  const solid = (x,y)=>{const tx=x/T|0, ty=y/T|0; if(x<0||y<0||tx>=N||ty>=N) return 1; const t=M[ty*N+tx]; return t===2||t===3;};
  const solidR = (x,y,r)=>solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r);
  const walkable = (x,y)=>{const tx=x/T|0, ty=y/T|0; if(x<0||y<0||tx>=N||ty>=N) return 0; const t=M[ty*N+tx]; return t===1||t>3;};

  function tileAt(x,y){const tx=x/T|0, ty=y/T|0; if(tx<0||ty<0||tx>=N||ty>=N) return 0; return M[ty*N+tx];}
  function zoneName(x,y){
    const tx=x/T/10|0, ty=y/T/10|0;
    const d = zoneOf(clamp(tx,0,9), clamp(ty,0,9));
    return {c:'COAST',d:'DOWNTOWN',i:'INDUSTRIAL',s:'SUBURBS',r:'RESIDENTIAL'}[d] || 'CITY';
  }
  function heightAt(x,y){
    const tx=x/T|0, ty=y/T|0; if(tx<0||ty<0||tx>=N||ty>=N) return 0;
    const k=M[ty*N+tx]; if(k===1) return 1.6; return 0;
  }

  // Bridge
  let bridgeOpen = false, bridgeWarn = false;
  const BR = {x0:72*T, x1:80*T, y0:20*T, y1:22*T};
  function setBridge(open){
    if(open===bridgeOpen) return;
    bridgeOpen = open;
    for(let ty=20;ty<22;ty++)for(let tx=72;tx<80;tx++) M[ty*N+tx] = open?3:0;
    if(open){
      for(const c of Game.cars){
        if(c.t<11 && c.x>=BR.x0 && c.x<BR.x1 && c.y>=BR.y0 && c.y<BR.y1){
          c.x = c.x<76*T?70.8*T:81.2*T; c.vx=c.vy=0; c.sp=0;
        }
      }
      const p=Game.player; if(!p.car && p.x>=BR.x0&&p.x<BR.x1&&p.y>=BR.y0&&p.y<BR.y1) p.x = p.x<76*T?70.8*T:81.2*T;
    } else {
      for(const c of Game.cars){
        if(c.t>10 && c.x>=BR.x0&&c.x<BR.x1&&c.y>=BR.y0&&c.y<BR.y1){c.y = c.y<21*T?19.3*T:22.7*T; c.vx=c.vy=0;}
      }
    }
  }
  function bridgeTick(time){
    const cyc = (time+20)%60;
    const open = cyc>=39 && cyc<59;
    const warn = cyc>=35 && cyc<39;
    if(warn && !bridgeWarn){ bridgeWarn=true; Notify.push('⚠ Мост разводится!', {id:'bridge', priority:'high', duration:3}); }
    if(cyc<35) bridgeWarn=false;
    setBridge(open);
  }

  // Seed from hash
  function rng(seed){ let s=seed>>>0; return ()=>{s=(s*1664525+1013904223)>>>0; return s/4294967296}; }

  return {M,H,CV,hash,generate,isWater,solid,solidR,walkable,tileAt,zoneName,heightAt,bridgeTick,get bridgeOpen(){return bridgeOpen},BR};
})();

/* ---------------- Renderer ---------------- */
const Render = (()=>{
  const VW = ()=>innerWidth, VH = ()=>innerHeight;
  const canvas = $('c'), g2d = canvas.getContext('2d');
  const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.domElement.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none';
  document.body.insertBefore(renderer.domElement, canvas);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(62, 1, 1, 1400);
  const ambient = new THREE.AmbientLight(0xffffff, .62);
  const sun = new THREE.DirectionalLight(0xfff2d0, .95);
  sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-260; sun.shadow.camera.right=260; sun.shadow.camera.top=260; sun.shadow.camera.bottom=-260;
  sun.shadow.camera.near=1; sun.shadow.camera.far=900; sun.shadow.bias=-0.0004;
  sun.position.set(-300,500,200); scene.add(ambient, sun);
  const moonLight = new THREE.DirectionalLight(0x9db6ff, .0); moonLight.position.set(200,300,-150); scene.add(moonLight);
  scene.background = new THREE.Color(0x7ec8ff);
  scene.fog = new THREE.Fog(0x7ec8ff, 320, 900);

  // interior
  const iscene = new THREE.Scene(); iscene.background = new THREE.Color(0x0a0612);
  const icam = new THREE.PerspectiveCamera(55, 1, 1, 900);

  // shared materials / geo caches
  const MTC = new Map(), GC = new Map();
  function mat(c){ if(typeof c==='string'){ if(!MTC.has(c)) MTC.set(c, new THREE.MeshLambertMaterial({color:c})); return MTC.get(c); } return c; }
  function bas(c){ const k='b'+c; if(!MTC.has(k)) MTC.set(k, new THREE.MeshBasicMaterial({color:c})); return MTC.get(k); }
  function geo(w,h,d){ const k=w+'_'+h+'_'+d; if(!GC.has(k)) GC.set(k,new THREE.BoxGeometry(w,h,d)); return GC.get(k); }
  function box(parent,w,h,d,m,x,y,z){
    const o=new THREE.Mesh(geo(w,h,d), mat(m)); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; parent.add(o); return o;
  }

  /* ---------- textures ---------- */
  function canvasTex(w,h,drawFn,{repeat=false, aniso=4}={}){
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d'); drawFn(ctx,w,h);
    const t=new THREE.CanvasTexture(c);
    if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;}
    t.anisotropy=aniso; t.encoding=THREE.sRGBEncoding; return t;
  }

  function asphaltTex(){
    return canvasTex(256,256,(x,w,h)=>{
      x.fillStyle='#2b2d33'; x.fillRect(0,0,w,h);
      for(let i=0;i<2200;i++){const g=ri(30,60);x.fillStyle=`rgba(${g},${g},${g+6},${rnd(.15,.45)})`;x.fillRect(rnd(0,w),rnd(0,h),rnd(1,2.5),rnd(1,2.5));}
      x.strokeStyle='#e8c040'; x.lineWidth=3; x.setLineDash([14,10]);
      x.beginPath(); x.moveTo(0,h/2); x.lineTo(w,h/2); x.stroke();
      x.strokeStyle='rgba(220,220,220,.55)'; x.lineWidth=2; x.setLineDash([6,10]);
      x.beginPath(); x.moveTo(w*.5,0); x.lineTo(w*.5,h); x.stroke();
      // tire shine
      x.fillStyle='rgba(0,0,0,.25)'; x.fillRect(0,h*.44,w,3); x.fillRect(0,h*.56,w,3);
    },{repeat:true});
  }
  function sidewalkTex(){
    return canvasTex(128,128,(x,w,h)=>{
      x.fillStyle='#a8a8a2'; x.fillRect(0,0,w,h);
      x.strokeStyle='#0003'; x.lineWidth=1;
      for(let i=0;i<=w;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(w,i);x.stroke();}
      for(let i=0;i<90;i++){x.fillStyle=Math.random()<.5?'#00000018':'#ffffff22';x.fillRect(Math.random()*w,Math.random()*h,2,2);}
    },{repeat:true});
  }
  function grassTex(){
    return canvasTex(128,128,(x,w,h)=>{
      x.fillStyle='#3f7a3a'; x.fillRect(0,0,w,h);
      for(let i=0;i<1400;i++){const g=ri(50,120);x.fillStyle=`rgba(${g/2|0},${g},${g/2|0},.5)`;x.fillRect(rnd(0,w),rnd(0,h),1.5,1.5);}
    },{repeat:true});
  }
  function facadeTex(col, lit){
    return canvasTex(128,256,(x,w,h)=>{
      x.fillStyle=col; x.fillRect(0,0,w,h);
      for(let f=0;f<2;f++)for(let k=0;k<2;k++){
        const on = World.hash((f*7+k*3)|0, f+k) > .55;
        const X=16+k*60, Y=f*128+34;
        x.fillStyle = lit ? (on?'#ffd76a':'#221a10') : '#2b3a4a';
        x.fillRect(X-3,Y-3,48,66);
        x.fillStyle = lit ? (on?'#ffd76a':'#2b1d0f') : (on?'#9fc4e0':'#4a5c70');
        x.fillRect(X,Y,42,60);
        x.fillStyle='rgba(255,255,255,.35)'; x.fillRect(X,Y,42,4);
      }
      x.fillStyle='rgba(0,0,0,.22)'; x.fillRect(0,124,w,4); x.fillRect(0,252,w,4);
    });
  }

  /* ---------- static world build ---------- */
  const PAL = ['#7a8ba8','#a58fb8','#c28b78','#6fa5a0','#b9b36a','#8a8f99','#cf7f9f','#79a36f','#c0207a'];
  const FMat = PAL.map((c,i)=>({
    m: new THREE.MeshLambertMaterial({map:facadeTex(c,false), emissiveMap:facadeTex(c,true), emissive:0xffffff, emissiveIntensity:0}),
    r: new THREE.MeshLambertMaterial({color:new THREE.Color(c).multiplyScalar(.65)})
  }));

  const GH = {};
  const gb = h=>{ if(!GH[h]){ const g=new THREE.BoxGeometry(T,h,T); const u=g.attributes.uv; for(let i=0;i<u.count;i++) if(i<8||i>=16) u.setY(i,u.getY(i)*h/64); GH[h]=g; } return GH[h]; };

  function buildWorld(){
    // ground planes
    const sz = 6400, seg = 120;
    const pg = new THREE.PlaneGeometry(sz,sz,seg,seg); pg.rotateX(-Math.PI/2);
    const p = pg.attributes.position; const cc = new Float32Array(p.count*3);
    const stops = [[0,'#5aa04e'],[.1,'#a5b36a'],[.2,'#e6d398'],[.55,'#d9c386'],[.75,'#a89564'],[1,'#6a7a68']].map(a=>[a[0],new THREE.Color(a[1])]);
    const c1 = new THREE.Color();
    const ht = (x,z)=>{ const rdd=(x,z,r)=>hyp(Math.max(r[0]-x,0,x-r[2]),Math.max(r[1]-z,0,z-r[3]));
      const R1=[0,0,60*T,60*T],R2=[92*T,12*T,100*T,32*T];
      return -9*smooth(clamp(Math.min(rdd(x,z,R1),rdd(x,z,R2))/260,0,1)); };
    for(let i=0;i<p.count;i++){
      const x=p.getX(i)+N*T/2, z=p.getZ(i)+N*T/2, h=ht(x,z), t=-h/9;
      p.setXYZ(i,x,h-.3,z);
      let j=0; while(j<stops.length-2 && t>stops[j+1][0]) j++;
      const f=clamp((t-stops[j][0])/(stops[j+1][0]-stops[j][0]),0,1);
      c1.copy(stops[j][1]).lerp(stops[j+1][1],f);
      cc[i*3]=c1.r; cc[i*3+1]=c1.g; cc[i*3+2]=c1.b;
    }
    pg.setAttribute('color', new THREE.BufferAttribute(cc,3)); pg.computeVertexNormals();
    scene.add(new THREE.Mesh(pg, new THREE.MeshLambertMaterial({vertexColors:true})));
    // water
    const w = new THREE.Mesh(new THREE.PlaneGeometry(sz,sz), new THREE.MeshLambertMaterial({color:0x2a86c4, transparent:true, opacity:.92}));
    w.rotation.x=-Math.PI/2; w.position.set(N*T/2,-6,N*T/2); scene.add(w);

    // road & sidewalk instancing
    buildRoadInstances();
    // buildings
    buildBuildings();
    // props
    buildProps();
    // bridge
    buildBridge();
    // lamps
    buildLamps();
    // signs
    buildSigns();
    // sky dome
    const sky = new THREE.Mesh(new THREE.SphereGeometry(1000,24,16), new THREE.MeshBasicMaterial({color:0x7ec8ff, side:THREE.BackSide, fog:false}));
    scene.add(sky); scene.userData.sky = sky;

  function buildRoadInstances(){
    const mat = new THREE.MeshLambertMaterial({map: asphaltTex()});

    const d = new THREE.Object3D();
    arr.forEach((i,j)=>{ d.position.set((i%N)*T+16,.8,(i/N|0)*T+16); d.updateMatrix(); o.setMatrixAt(j,d.matrix); });
    o.receiveShadow=true; scene.add(o);

    const swMat = new THREE.MeshLambertMaterial({map: sidewalkTex()});
    const arr2=[]; for(let i=0;i<N*N;i++){ const tx=i%N, ty=i/N|0; if(World.M[i]===0 && (tx%10<2||ty%10<2)) arr2.push(i); }
    const o2 = new THREE.InstancedMesh(new THREE.BoxGeometry(T+1.2, 2.4, T+1.2), swMat, arr2.length);
    arr2.forEach((i,j)=>{ d.position.set((i%N)*T+16, 1.2, (i/N|0)*T+16); d.updateMatrix(); o2.setMatrixAt(j, d.matrix); });

  const CHG = {};
  const groups = new Map();
  function groupFor(tx,ty){
    const k = (tx/10|0)+','+(ty/10|0);

      scene.add(g); groups.set(k,g); CHG[k]=g;

  const HB = new Uint16Array(N*N);

  function buildBuildings(){
    for(let i=0;i<N*N;i++){
      const tx=i%N, ty=i/N|0, k=World.M[i], cx=tx*T+16, cz=ty*T+16;
      if(k!==2) continue;
      const h=Math.max(16,Math.round(World.H[i]*2.2/4)*4), f=FMat[World.CV[i]%FMat.length];
      const m = new THREE.Mesh(gb(h), [f.m,f.m,f.r,f.r,f.m,f.m]);
      m.position.set(cx, h/2, cz); m.castShadow=true; m.receiveShadow=true;
      groupFor(tx,ty).add(m); HB[i]=h;

      if(World.CV[i]<3 && World.M[i+N]!==2){
        const nm = new THREE.MeshBasicMaterial({color:NCl[World.CV[i]], transparent:true, opacity:.6});
        neonMats.push(nm);
        const q = new THREE.Mesh(geo(26,6,1), nm);

      if(World.hash(tx,ty)>.7){
        const box_ = new THREE.Mesh(geo(10,6,10), new THREE.MeshLambertMaterial({color:0x55585f}));
        box_.position.set(cx + rnd(-8,8), h+3, cz + rnd(-8,8));
        box_.castShadow=true; groupFor(tx,ty).add(box_);
      }
    }
  }

  const lamps = [];
  function buildLamps(){
    const pos=[];
    for(let i=0;i<N*N;i++){ const tx=i%N, ty=i/N|0;
      if(World.M[i]===1 && (tx%10===2||ty%10===2) && World.hash(tx*3,ty*5)>.9) pos.push([tx*T+16, ty*T+16]);

  function buildProps(){

    const d = new THREE.Object3D();
    trees.forEach((p,i)=>{ d.position.set(p[0],0,p[1]); const s=.85+World.hash(i,3)*.5; d.scale.setScalar(s); d.updateMatrix(); trunk.setMatrixAt(i,d.matrix); leaf.setMatrixAt(i,d.matrix); d.scale.setScalar(1); });
    scene.add(trunk, leaf);

  function buildBridge(){
    const BH = x=> x<56*T?0 : x<68*T?18*smooth((x-56*T)/(12*T)) : x<84*T?18 : 18*smooth((92*T-x)/(8*T));
    for(let x=56*T;x<92*T;x+=8){
      if(x>=72*T && x<80*T) continue;
      const h=BH(x+4);
      box(scene,8.3,1.6,64,'#555555',x+4,h-.8,21*T);

    }
    // side towers
    for(let t=58;t<92;t+=3){ if(t>=70&&t<82) continue; const h=BH(t*T);

    // draw lift spans

      g.position.set(tx*T,18,21*T);
      box(g,4*T,1.6,64,'#555555',o*2*T,-.8,0);
      box(g,4*T,.2,.8,'#e8c040',o*2*T,.1,0);

    });
    // towers
    for(const x of [72*T-4, 80*T+4]) for(const z of [20*T-2,22*T+2]){
      box(scene,6,62,6,'#777777',x,31,z);

    }
    // traffic lights
    const tlPos=[];
    for(let a=0;a<6;a++)for(let b=0;b<6;b++){
      const x0=a*10*T,z0=b*10*T;
      tlPos.push([x0-4,z0-4,0],[x0+2*T+4,z0-4,1],[x0-4,z0+2*T+4,1],[x0+2*T+4,z0+2*T+4,0]);
    }
    const dm=new THREE.Object3D();

    scene.add(pole, lm);

  function carModelRaw(c){
    const CP = [
      [48,22,5.5,24,5.5,-2,4.2,0],[50,22,6.5,25,6,-2,4.8,1],[50,22,7,28,7.5,-1,5,2],

      [46,20,5.2,22,5.5,-1,4,0],[41,20,5.5,22,6,-3,3.9,0],[50,22,11,38,4,3,4.2,5],
      [50,21,5.5,24,5.5,-2,4.2,0],[70,24,15,58,6,0,5,6]
    ];
    const carColors = ['#101317','#27344f','#2f3b32','#ffb000','#d8141b','#f2c400','#8c9096','#a8a290','#d9dcdf','#f0f0f0','#c9d3dc'];
    const q = CP[c.t], L=q[0],W=q[1],bh=q[2],cl=q[3],ch=q[4],cx=q[5],wr=q[6],k=q[7];
    const G = new THREE.Group();
    const col = carColors[c.t];
    const bodyMat = new THREE.MeshPhongMaterial({color:col, specular:0xbbbbbb, shininess:80});
    const glass = new THREE.MeshPhongMaterial({color:0x16222e, specular:0x999999, shininess:120});
    const y0 = wr-.4, tp = y0+bh;
    box(G, L, bh*.55, W, bodyMat, 0, y0+bh*.275, 0);
    box(G, L-3, bh*.5, W-1.6, bodyMat, 0, y0+bh*.78, 0);
    box(G, cl*.9, ch*.85, W-4.6, glass, cx, tp+ch*.4, 0);
    const ws = box(G, cl*.55, .8, W-5.4, glass, cx+cl*.38, tp+ch*.5, 0); ws.rotation.z=-.72;
    const rg = box(G, cl*.5, .8, W-5.4, glass, cx-cl*.4, tp+ch*.5, 0); rg.rotation.z=.62;
    box(G, cl*.6, .9, W-5.2, bodyMat, cx-.5, tp+ch*.88, 0);
    const hd = box(G, L*.3, .6, W-3, bodyMat, L*.33, tp-.3, 0); hd.rotation.z=-.06;
    box(G, 1.6, bh*.7, W, '#1a1a1a', L/2, y0+bh*.3, 0);
    box(G, 1.6, bh*.7, W, '#1a1a1a', -L/2, y0+bh*.3, 0);
    // headlights
    for(const a of [-1,1]){

    }
    // wheels
    const WG = new THREE.CylinderGeometry(wr,wr,3,12);
    for(const a of [-1,1]) for(const b of [-1,1]){
      const x=b*L*.32;
      const t=new THREE.Mesh(WG, mat('#111')); t.position.set(x,wr,a*(W/2-1)); t.rotation.x=1.5708; t.scale.set(.6,1,.6); t.castShadow=true; G.add(t);
      const rim=new THREE.Mesh(WG, mat('#cccccc')); rim.position.set(x,wr,a*(W/2-.15)); rim.rotation.x=1.5708; rim.scale.set(.35,1.1,.35); G.add(rim);
    }
    if(c.pol){
      const a=box(G,3,2,5,bas('#ff2222'),cx,tp+ch+1.6,-3);
      const b=box(G,3,2,5,bas('#2288ff'),cx,tp+ch+1.6,3);

    return G;

  };

      G(53.5,12.5,'Встреча на побережье'),
      D(['Рик','Слышал, ты работаешь на Дэна. Сначала разберись с моими проблемами.']),
      F(3,54,16,'Разберитесь с бандой'),
      G(53.5,42.5,'Отчитайтесь на юге побережья',1),
      D(['Рик','Хорошая работа. Мы ещё поговорим.']),

    ]},
    {n:'Цена доверия', s:[

      G(4.5,12.5,'Приезжайте к мотелю'),
